<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 520" width="440" height="520" role="img" aria-label="Placeholder portrait">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#efe7db"/>
      <stop offset="1" stop-color="#c9bba6"/>
    </linearGradient>
    <linearGradient id="head" x1="0.15" y1="0.05" x2="0.9" y2="1">
      <stop offset="0" stop-color="#8d8272"/>
      <stop offset="1" stop-color="#3b352c"/>
    </linearGradient>
    <linearGradient id="torso" x1="0.1" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5c5446"/>
      <stop offset="1" stop-color="#211e18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.28" r="0.6">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="halftone" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3.5" r="1.15" fill="#000" opacity="0.16"/>
    </pattern>
    <clipPath id="frame"><rect width="440" height="520"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="440" height="520" fill="url(#bg)"/>
    <rect width="440" height="520" fill="url(#glow)"/>

    <!-- shoulders -->
    <path d="M28 520c0-108 86-183 192-183s192 75 192 183z" fill="url(#torso)"/>
    <!-- collar -->
    <path d="M162 366c18 34 40 52 58 52s40-18 58-52" fill="none" stroke="#efe7db" stroke-width="7" stroke-opacity="0.5"/>
    <!-- head -->
    <ellipse cx="220" cy="204" rx="98" ry="112" fill="url(#head)"/>
    <!-- hair mass -->
    <path d="M122 196c0-62 44-104 98-104s98 42 98 104c0 14-4 24-9 24-8 0-9-52-89-52-72 0-83 46-89 52-5 4-9-10-9-24z" fill="#241f19" opacity="0.85"/>

    <rect width="440" height="520" fill="url(#halftone)"/>
    <path d="M0 337h440" stroke="#16140f" stroke-width="1" opacity="0.16"/>
  </g>
</svg>
